<!DOCTYPE html>
<html lang=en>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor</title>
    <style>
      #drag-container {
        width: 500px;
        height: 300px;
        border: 2px dashed #333;
        position: relative;
        overflow: hidden;
      }
      #add-ic-button {
        width: 200px;
        height: 75px;
        border: 2px solid #333;
        position: relative;
        overflow: hidden;
      }
      #dropdown-container {
        display: none;
        margin-top: 10px;
      }
      .draggable {
        width: 50px;
        height: 50px;
        background-color: #3498db;
        position: relative;
        cursor: grab;
      }
    </style>
  </head>
  <body>
    <h1 id="pseudo-log">{     }</h1>
    <button id="add-ic-button" onclick="circuitDropdown()">ADD CIRCUIT</button>
    <div id="dropdown-container">
      <select id="item-list" onchange="selectCircuit()">
        <option value="" disabled selected>Select an option</option>
        <option value="and">AND</option>
        <option value="not">NOT</option>
      </select>
    </div>
    <div id="drag-container">
      <div class="draggable" id="dragItem" style="top: 10; left: 10;"></div>
    </div>
    <script>
      function circuitDropdown() {
        var dropdown = document.getElementById("dropdown-container");
        dropdown.style.display = dropdown.style.display === "none" ? "block" : "none";
      }
      function selectItem() {
        var selected = document.getElementById("item-list").value;
        
      }
    </script>
    <script>
      const dragItem = document.getElementById("dragItem");
      const container = document.getElementById("drag-container");
      const pseudoLog = document.getElementById("pseudo-log");
      const icButton = document.getElementById("add-ic-button");
      let offsetX, offsetY, isDragging = false;
      icButton.addEventListener("click")
      dragItem.addEventListener("mousedown", (e) => {
        isDragging = true;
        offsetX = e.clientX - dragItem.getBoundingClientRect().left + container.getBoundingClientRect().left;
        offsetY = e.clientY - dragItem.getBoundingClientRect().top + container.getBoundingClientRect().top;
        dragItem.style.cursor = "grabbing";
      });
      document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        
        let x = e.clientX - offsetX;
        let y = e.clientY - offsetY;

        pseudoLog.innerText = `${x}, ${y}`;

        const maxX = container.clientWidth - dragItem.clientWidth;
        const maxY = container.clientHeight - dragItem.clientHeight;

        x = Math.max(0, Math.min(x, maxX));
        y = Math.max(0, Math.min(y, maxY));

        dragItem.style.left = `${x}px`;
        dragItem.style.top = `${y}px`;
      });
      document.addEventListener("mouseup", () => {
        isDragging = false;
        dragItem.style.cursor = "grab";
      });
    </script>
  </body>
</html>
